services:
  api:
    build: .
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      - mlflow

  retrainer:
    build: .
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: ["python", "-m", "src.realtime_ai_platform.pipeline.scheduler"]
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      - mlflow

  dashboard:
    build: .
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: ["streamlit", "run", "src/realtime_ai_platform/dashboard/app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlruns"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow:/mlflow

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
